spring.application.name=podcasts
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/podcasts_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Настройки JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Необязательное безопасное создание первого администратора через переменные окружения.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Administrator}
